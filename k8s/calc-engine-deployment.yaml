apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: calc-engine
  template:
    metadata:
      labels:
        app: calc-engine
    spec:
      containers:
      - name: calc-engine
        image: your-registry/calc-engine:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: calc-engine-service
spec:
  selector:
    app: calc-engine
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: calc-engine-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: calc-engine
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
